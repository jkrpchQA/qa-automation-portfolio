[pytest]
pythonpath = .
testpaths = ui api
addopts = --import-mode=importlib -ra -v --reruns 2 --reruns-delay 2
markers =
    smoke: критичные сценарии, быстрый прогон перед релизом
    regression: полный регрессионный набор
    ui: UI-тесты на Playwright
    api: API-тесты на requests
    negative: негативные сценарии (ошибки, валидация, отказ доступа)
